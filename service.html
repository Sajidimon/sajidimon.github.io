<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Details — Imon Chowdhury</title>
  <meta name="description" content="Explore Imon Chowdhury's professional web development services including WordPress, eCommerce, and landing page design.">
  <link rel="shortcut icon" href="./image/favicon.jpg" type="image/x-icon">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Main styles -->
  <link rel="stylesheet" href="./styles.css">

  <style>
    /* ── Page-specific overrides ── */
    body { background: var(--bg); }

    /* ── Top Bar ── */
    .service-topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,.9); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 12px rgba(0,0,0,.06);
    }
    .service-topbar-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 1.5rem;
      height: 68px; display: flex; align-items: center; justify-content: space-between;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: .55rem;
      font-size: .88rem; font-weight: 600; color: var(--text-mid);
      padding: .5rem .9rem; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: white;
      transition: var(--transition);
    }
    .back-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .topbar-title {
      font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 700;
      color: var(--text-dark);
    }
    .topbar-logo {
      font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* ── Hero Banner ── */
    .service-hero {
      background: linear-gradient(150deg, #f0f4ff 0%, #fdf2ff 60%, #f0f4ff 100%);
      padding: 3rem 0 0;
      position: relative; overflow: hidden;
    }
    .service-hero::before {
      content:''; position:absolute; top:-6rem; left:-4rem;
      width:28rem; height:28rem; border-radius:50%;
      background: radial-gradient(circle, rgba(99,102,241,.1) 0%, transparent 70%);
      pointer-events:none;
    }
    .service-hero::after {
      content:''; position:absolute; bottom:-4rem; right:-3rem;
      width:22rem; height:22rem; border-radius:50%;
      background: radial-gradient(circle, rgba(139,92,246,.08) 0%, transparent 70%);
      pointer-events:none;
    }
    .service-hero-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 1.5rem;
      position: relative; z-index: 1;
    }
    .service-breadcrumb {
      display: flex; align-items: center; gap: .5rem;
      font-size: .8rem; color: var(--text-muted); margin-bottom: 1.5rem;
    }
    .service-breadcrumb a { color: var(--primary); font-weight: 600; }
    .service-breadcrumb a:hover { text-decoration: underline; }
    .service-breadcrumb i { font-size: .65rem; }
    .service-hero-badge {
      display: inline-flex; align-items: center; gap: .4rem;
      font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      padding: .3rem .9rem; border-radius: 99px; margin-bottom: 1rem;
      color: white;
    }
    .service-hero-badge.popular  { background: var(--primary); }
    .service-hero-badge.express  { background: var(--accent-2); }
    .service-hero-badge.trending { background: #7c3aed; }
    .service-hero-badge.new      { background: var(--success); }
    .service-hero-title {
      font-family: 'Outfit', sans-serif; font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      font-weight: 800; color: var(--text-dark); line-height: 1.25;
      max-width: 700px; margin-bottom: 1rem;
    }
    .service-hero-short {
      font-size: 1.05rem; color: var(--text-soft); max-width: 580px; line-height: 1.7;
      margin-bottom: 2rem;
    }
    .service-hero-meta {
      display: flex; flex-wrap: wrap; gap: 1.5rem; margin-bottom: 2.5rem;
    }
    .meta-item {
      display: flex; align-items: center; gap: .5rem;
      font-size: .88rem; color: var(--text-mid); font-weight: 500;
    }
    .meta-item i { color: var(--primary); }

    /* Image below header */
    .service-img-wrap {
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      overflow: hidden; max-height: 380px; margin-top: 1rem;
    }
    .service-img-wrap img {
      width: 100%; height: 380px; object-fit: cover;
      display: block; border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    }

    /* ── Main content layout ── */
    .service-main {
      max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem 5rem;
      display: grid; grid-template-columns: 1fr 360px; gap: 2.5rem; align-items: start;
    }

    /* ── Left: Details ── */
    .detail-card { margin-bottom: 2rem; }
    .detail-section-title {
      font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 700;
      color: var(--text-dark); margin-bottom: 1.25rem;
      display: flex; align-items: center; gap: .6rem;
    }
    .detail-section-title i { color: var(--primary); font-size: 1rem; }
    .detail-desc {
      font-size: .95rem; color: var(--text-soft); line-height: 1.85;
    }
    .features-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-top: 1.25rem;
    }
    .feature-item {
      display: flex; align-items: center; gap: .65rem;
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: .85rem 1rem;
      font-size: .88rem; font-weight: 500; color: var(--text-dark);
      transition: var(--transition);
    }
    .feature-item:hover { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
    .feature-item i { color: var(--success); font-size: .85rem; flex-shrink: 0; }

    /* Perks list */
    .perks-list { display: flex; flex-direction: column; gap: .75rem; }
    .perk-item {
      display: flex; align-items: center; gap: .85rem;
      padding: .85rem 1rem; background: var(--bg-2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: .9rem; color: var(--text-mid);
    }
    .perk-icon {
      width: 36px; height: 36px; border-radius: .6rem; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--primary-light); color: var(--primary); font-size: .9rem;
    }

    /* Other services */
    .other-services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
    .other-service-card {
      background: var(--bg-2); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 1rem;
      transition: var(--transition); cursor: pointer;
    }
    .other-service-card:hover { border-color: var(--primary); background: var(--primary-light); }
    .other-service-card img { width: 100%; height: 90px; object-fit: cover; border-radius: .5rem; margin-bottom: .65rem; }
    .other-service-card-title { font-size: .8rem; font-weight: 600; color: var(--text-dark); line-height: 1.35; }
    .other-service-card-price { font-size: .75rem; color: var(--primary); font-weight: 700; margin-top: .3rem; }

    /* ── Right Sidebar ── */
    .sidebar { display: flex; flex-direction: column; gap: 1.5rem; }
    .sidebar-card { padding: 1.75rem; }
    .price-block { margin-bottom: 1.25rem; }
    .price-label { font-size: .75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .3rem; }
    .price-value {
      font-family: 'Outfit', sans-serif; font-size: 2.8rem; font-weight: 900;
      color: var(--text-dark); line-height: 1;
    }
    .price-value sup { font-size: 1.4rem; vertical-align: super; }
    .price-note { font-size: .78rem; color: var(--text-soft); margin-top: .35rem; }
    .delivery-row {
      display: flex; align-items: center; gap: .6rem;
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: .75rem 1rem;
      font-size: .88rem; font-weight: 600; color: var(--text-dark);
      margin-bottom: 1.25rem;
    }
    .delivery-row i { color: var(--primary); }
    .rating-row {
      display: flex; align-items: center; gap: .5rem;
      margin-bottom: 1.5rem;
    }
    .stars { color: var(--accent); font-size: .9rem; }
    .rating-val { font-size: .95rem; font-weight: 700; color: var(--text-dark); }
    .rating-count { font-size: .8rem; color: var(--text-muted); }
    .cta-wa {
      display: flex; align-items: center; justify-content: center; gap: .65rem;
      width: 100%; padding: 1rem; border-radius: var(--radius-sm);
      background: #25d366; color: white; font-size: 1rem; font-weight: 700;
      border: none; cursor: pointer; transition: var(--transition);
      text-decoration: none; margin-bottom: .75rem;
    }
    .cta-wa:hover { background: #22c55e; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,211,102,.35); }
    .cta-contact {
      display: flex; align-items: center; justify-content: center; gap: .65rem;
      width: 100%; padding: .85rem; border-radius: var(--radius-sm);
      background: white; color: var(--primary); font-size: .92rem; font-weight: 700;
      border: 2px solid var(--primary); cursor: pointer; transition: var(--transition);
      text-decoration: none;
    }
    .cta-contact:hover { background: var(--primary); color: white; }
    .cta-note { text-align: center; font-size: .72rem; color: var(--text-muted); margin-top: .6rem; }

    /* Profile Card */
    .profile-mini { display: flex; align-items: center; gap: .85rem; margin-bottom: 1.25rem; }
    .profile-mini img {
      width: 52px; height: 52px; border-radius: 50%; object-fit: cover;
      border: 3px solid var(--primary-light);
    }
    .profile-mini-name { font-size: .95rem; font-weight: 700; color: var(--text-dark); }
    .profile-mini-title { font-size: .78rem; color: var(--text-soft); }
    .profile-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5rem; margin-bottom: 1.25rem; }
    .profile-stat {
      text-align: center; background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: .6rem .4rem;
    }
    .profile-stat-val { font-size: 1rem; font-weight: 800; color: var(--text-dark); }
    .profile-stat-lbl { font-size: .65rem; color: var(--text-muted); font-weight: 500; }

    /* Trust badges */
    .trust-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .trust-item {
      display: flex; align-items: center; gap: .5rem;
      font-size: .78rem; color: var(--text-mid); font-weight: 500;
    }
    .trust-item i { color: var(--primary); font-size: .85rem; }

    /* ── Not Found ── */
    .not-found {
      max-width: 480px; margin: 6rem auto; text-align: center;
      padding: 3rem; background: white; border: 1px solid var(--border);
      border-radius: var(--radius-xl); box-shadow: var(--shadow-md);
    }
    .not-found-icon { font-size: 3.5rem; margin-bottom: 1.25rem; }
    .not-found h2 { font-size: 1.4rem; font-weight: 800; color: var(--text-dark); margin-bottom: .75rem; }
    .not-found p { font-size: .95rem; color: var(--text-soft); margin-bottom: 1.75rem; }

    /* ── Footer ── */
    .service-footer {
      background: var(--text-dark); color: rgba(255,255,255,.5);
      text-align: center; padding: 2rem 1.5rem;
    }
    .service-footer a { color: rgba(255,255,255,.7); font-weight: 600; }
    .service-footer a:hover { color: white; }
    .service-footer p { font-size: .85rem; margin-top: .4rem; }

    /* Responsive */
    @media (max-width: 900px) {
      .service-main { grid-template-columns: 1fr; }
      .sidebar { order: -1; }
      .features-grid { grid-template-columns: 1fr; }
      .other-services-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      .service-hero-meta { gap: 1rem; }
      .other-services-grid { grid-template-columns: 1fr; }
      .trust-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ── Top Bar ── -->
<header class="service-topbar">
  <div class="service-topbar-inner">
    <a href="index.html#services" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> Back to Services
    </a>
    <span class="topbar-title" id="topbarTitle">Service Details</span>
    <a href="index.html" class="topbar-logo">Imon Chowdhury</a>
  </div>
</header>

<!-- ── Dynamic Content Area ── -->
<div id="serviceRoot">
  <!-- Content injected by JS -->
  <div style="display:flex;align-items:center;justify-content:center;height:60vh;">
    <div style="text-align:center;">
      <div style="font-size:2rem;margin-bottom:.75rem;animation:spin 1s linear infinite;display:inline-block;">⚙️</div>
      <p style="color:var(--text-soft);font-weight:500;">Loading service details…</p>
    </div>
  </div>
</div>

<!-- WhatsApp Float -->
<div class="wa-float">
  <span class="wa-tooltip">Chat on WhatsApp</span>
  <a class="wa-btn" href="https://wa.me/8801875349813?text=Hi%20Imon%2C%20I%27m%20interested%20in%20your%20services." target="_blank" aria-label="WhatsApp">
    <i class="fab fa-whatsapp"></i>
  </a>
</div>

<!-- ── Scripts ── -->
<script src="./services.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const id     = params.get('id');
  const data   = window.Services?.byId(id);
  const root   = document.getElementById('serviceRoot');
  const allSvcs= window.Services?.all || [];

  /* Badge class helper */
  const badgeCls = (b) => ({
    'Popular': 'popular', 'Express': 'express',
    'Trending': 'trending', 'New': 'new'
  })[b] || 'popular';

  /* Star HTML helper */
  const stars = (n) => '<i class="fa-solid fa-star"></i>'.repeat(n);

  /* Other services chips */
  const others = allSvcs.filter(s => String(s.id) !== String(id));
  const othersHTML = others.map(s => `
    <div class="other-service-card" onclick="location.href='service.html?id=${s.id}'">
      <img src="${s.image}" alt="${s.title}" loading="lazy">
      <div class="other-service-card-title">${s.title}</div>
      <div class="other-service-card-price">From $${s.price}</div>
    </div>
  `).join('');

  /* ── Not Found ── */
  if (!data) {
    document.getElementById('topbarTitle').textContent = 'Not Found';
    root.innerHTML = `
      <div class="not-found">
        <div class="not-found-icon">🔍</div>
        <h2>Service Not Found</h2>
        <p>The service you're looking for doesn't exist or the link may be invalid.</p>
        <a href="index.html#services" class="btn btn-primary">
          <i class="fa-solid fa-arrow-left"></i> Browse All Services
        </a>
      </div>
      <footer class="service-footer">
        <a href="index.html">Imon Chowdhury</a>
        <p>© 2025 All rights reserved.</p>
      </footer>
    `;
    return;
  }

  /* ── Update page title ── */
  document.title = `${data.title} — Imon Chowdhury`;
  document.getElementById('topbarTitle').textContent = data.badge + ' Service';

  /* ── Render ── */
  root.innerHTML = `
    <!-- Hero -->
    <section class="service-hero">
      <div class="service-hero-inner">
        <div class="service-breadcrumb">
          <a href="index.html">Home</a>
          <i class="fa-solid fa-chevron-right"></i>
          <a href="index.html#services">Services</a>
          <i class="fa-solid fa-chevron-right"></i>
          <span>${data.badge}</span>
        </div>
        <div class="service-hero-badge ${badgeCls(data.badge)}">
          <i class="fa-solid fa-fire"></i> ${data.badge}
        </div>
        <h1 class="service-hero-title">${data.title}</h1>
        <p class="service-hero-short">${data.short}</p>
        <div class="service-hero-meta">
          <div class="meta-item"><i class="fa-solid fa-clock"></i> Delivery: <strong>${data.delivery}</strong></div>
          <div class="meta-item"><i class="fa-solid fa-star" style="color:var(--accent);"></i> ${data.rating} rating (${data.reviews} reviews)</div>
          <div class="meta-item"><i class="fa-solid fa-tag"></i> Starting at <strong>$${data.price}</strong></div>
        </div>
        <div class="service-img-wrap">
          <img src="${data.image}" alt="${data.title}">
        </div>
      </div>
    </section>

    <!-- Main -->
    <div class="service-main">

      <!-- Left -->
      <div class="service-left">

        <!-- Description -->
        <div class="card detail-card" style="padding:2rem;">
          <div class="detail-section-title"><i class="fa-solid fa-circle-info"></i> About This Service</div>
          <p class="detail-desc">${data.description}</p>
        </div>

        <!-- Features -->
        <div class="card detail-card" style="padding:2rem;">
          <div class="detail-section-title"><i class="fa-solid fa-list-check"></i> What's Included</div>
          <div class="features-grid">
            ${data.features.map(f => `
              <div class="feature-item">
                <i class="fa-solid fa-circle-check"></i> ${f}
              </div>
            `).join('')}
          </div>
        </div>

        <!-- What you get -->
        <div class="card detail-card" style="padding:2rem;">
          <div class="detail-section-title"><i class="fa-solid fa-gift"></i> Why Choose Me</div>
          <div class="perks-list">
            <div class="perk-item">
              <div class="perk-icon"><i class="fa-solid fa-shield-halved"></i></div>
              <div>
                <div style="font-weight:600;font-size:.9rem;color:var(--text-dark);">Secure &amp; Optimized Build</div>
                <div style="font-size:.82rem;color:var(--text-soft);">Every project is built with security best practices and performance in mind.</div>
              </div>
            </div>
            <div class="perk-item">
              <div class="perk-icon"><i class="fa-solid fa-mobile-screen-button"></i></div>
              <div>
                <div style="font-weight:600;font-size:.9rem;color:var(--text-dark);">Mobile-First Responsive Design</div>
                <div style="font-size:.82rem;color:var(--text-soft);">Looks perfect on all devices — desktop, tablet, and mobile.</div>
              </div>
            </div>
            <div class="perk-item">
              <div class="perk-icon"><i class="fa-solid fa-headset"></i></div>
              <div>
                <div style="font-weight:600;font-size:.9rem;color:var(--text-dark);">7 Days Free Support</div>
                <div style="font-size:.82rem;color:var(--text-soft);">I'm available for revisions and questions for 7 days after delivery.</div>
              </div>
            </div>
            <div class="perk-item">
              <div class="perk-icon"><i class="fa-solid fa-code-commit"></i></div>
              <div>
                <div style="font-weight:600;font-size:.9rem;color:var(--text-dark);">Clean, Documented Code</div>
                <div style="font-size:.82rem;color:var(--text-soft);">Well-structured code you (or your team) can easily maintain and extend.</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Other services -->
        ${others.length ? `
        <div class="card detail-card" style="padding:2rem;">
          <div class="detail-section-title"><i class="fa-solid fa-grid-2"></i> Other Services</div>
          <div class="other-services-grid">${othersHTML}</div>
        </div>
        ` : ''}

      </div><!-- /left -->

      <!-- Sidebar -->
      <aside class="sidebar">

        <!-- Order card -->
        <div class="card sidebar-card">
          <div class="price-block">
            <div class="price-label">Starting price</div>
            <div class="price-value"><sup>$</sup>${data.price}</div>
            <div class="price-note">Final price depends on scope. Contact to get a custom quote.</div>
          </div>

          <div class="delivery-row">
            <i class="fa-regular fa-clock"></i>
            Delivery in <strong style="margin-left:.25rem;">${data.delivery}</strong>
          </div>

          <div class="rating-row">
            <div class="stars">${stars(5)}</div>
            <span class="rating-val">${data.rating}</span>
            <span class="rating-count">(${data.reviews} reviews)</span>
          </div>

          <a href="https://wa.me/8801875349813?text=Hi%20Imon%2C%20I%27m%20interested%20in%20your%20service%3A%20${encodeURIComponent(data.title)}"
             target="_blank" class="cta-wa">
            <i class="fab fa-whatsapp" style="font-size:1.2rem;"></i> Order via WhatsApp
          </a>

          <a href="index.html#contact" class="cta-contact">
            <i class="fa-solid fa-paper-plane"></i> Send Inquiry
          </a>

          <p class="cta-note"><i class="fa-solid fa-lock" style="color:var(--success);"></i> 100% satisfaction guarantee · No payment upfront</p>
        </div>

        <!-- Freelancer card -->
        <div class="card sidebar-card">
          <div class="profile-mini">
            <img src="./image/imon.jpg" alt="Imon Chowdhury">
            <div>
              <div class="profile-mini-name">Imon Chowdhury</div>
              <div class="profile-mini-title">Full Stack Web Developer</div>
            </div>
          </div>
          <div class="profile-stats">
            <div class="profile-stat">
              <div class="profile-stat-val">2+</div>
              <div class="profile-stat-lbl">Years Exp.</div>
            </div>
            <div class="profile-stat">
              <div class="profile-stat-val">10+</div>
              <div class="profile-stat-lbl">Projects</div>
            </div>
            <div class="profile-stat">
              <div class="profile-stat-val">5★</div>
              <div class="profile-stat-lbl">Rating</div>
            </div>
          </div>
          <a href="index.html#about" style="font-size:.85rem;font-weight:600;color:var(--primary);display:inline-flex;align-items:center;gap:.4rem;">
            View full profile <i class="fa-solid fa-arrow-right"></i>
          </a>
        </div>

        <!-- Trust badges -->
        <div class="card sidebar-card" style="padding:1.5rem;">
          <div class="detail-section-title" style="font-size:1rem;margin-bottom:1rem;"><i class="fa-solid fa-award"></i> Trust Badges</div>
          <div class="trust-grid">
            <div class="trust-item"><i class="fa-solid fa-circle-check"></i> On-time delivery</div>

  /* Scroll-reveal animation for left cards */
  const cards = document.querySelectorAll('.detail-card, .sidebar .card');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.style.opacity = '1';
        e.target.style.transform = 'translateY(0)';
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.08 });
  cards.forEach(c => {
    c.style.opacity = '0';
    c.style.transform = 'translateY(24px)';
    c.style.transition = 'opacity .6s ease, transform .6s ease';
    io.observe(c);
  });

})();
